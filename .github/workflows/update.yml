name: Update results

on:
  schedule:
    - cron: "30 22 * * *"   # every evening at 22:30 UTC
  workflow_dispatch:         # adds a "Run workflow" button for manual updates

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch latest results
        run: node scripts/update.mjs
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
      - name: Save changes
        run: |
          git config user.name "swingometer-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Update results"
            git push
          fi
